spring:
  application:
    name: manutencao

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/manutencao}
    username: ${DB_USER:manutencao}
    password: ${DB_PASSWORD:manutencao}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # o schema é do Flyway; o Hibernate só confere
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true             # erros padrão do Spring no formato RFC 7807

server:
  port: 8080
  error:
    include-message: never

app:
  zona-horaria: ${APP_TIMEZONE:America/Sao_Paulo}   # define o "hoje" das regras de data
  security:
    username: ${APP_AUTH_USERNAME}
    password: ${APP_AUTH_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Requer springdoc-openapi-starter-webmvc-ui no pom.xml
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
