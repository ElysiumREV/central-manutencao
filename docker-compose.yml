name: central-manutencao

services:
  db:
    image: postgres:16-alpine
    container_name: manutencao-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manutencao}
      POSTGRES_USER: ${POSTGRES_USER:-manutencao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manutencao}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: manutencao-api
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-manutencao}
      DB_USER: ${POSTGRES_USER:-manutencao}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-manutencao}
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME:-operador}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:-local-demo-password-change-me}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build: ./frontend
    container_name: manutencao-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  pgdata:
